name: Publish npm

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Git release tag to publish, such as v0.2.2.
        required: true
        type: string
      dry_run:
        description: Run npm publish with --dry-run instead of publishing.
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      tag:
        description: npm dist-tag to publish.
        required: true
        default: latest
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    environment: npm-publish

    steps:
      - name: Check release tag input
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Expected a semver tag like v0.2.2, got $RELEASE_TAG."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Show package tooling versions
        run: |
          node --version
          npm --version
          pnpm --version

      - name: Verify package version matches tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${RELEASE_TAG#v}"

          if [ "$package_version" != "$tag_version" ]; then
            echo "package.json version $package_version does not match tag $RELEASE_TAG."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check packed install
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['release:check-pack'] ? 0 : 1)"; then
            pnpm release:check-pack
          else
            echo "release:check-pack is not available on this release tag; skipping packed install check."
          fi

      - name: Dry-run publish
        if: ${{ inputs.dry_run == 'true' }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
            export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npm-publish.npmrc"
            printf '%s\n' \
              'registry=https://registry.npmjs.org/' \
              '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' \
              > "$NPM_CONFIG_USERCONFIG"
            echo "Using NPM_TOKEN fallback for npm dry-run publish."
          else
            unset NODE_AUTH_TOKEN
            unset NPM_CONFIG_USERCONFIG
            echo "No NPM_TOKEN configured; relying on npm Trusted Publishing/OIDC for dry-run publish."
          fi

          npm publish --registry=https://registry.npmjs.org/ --access public --tag "$NPM_TAG" --provenance --dry-run

      - name: Publish
        if: ${{ inputs.dry_run != 'true' }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
            export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npm-publish.npmrc"
            printf '%s\n' \
              'registry=https://registry.npmjs.org/' \
              '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' \
              > "$NPM_CONFIG_USERCONFIG"
            echo "Using NPM_TOKEN fallback for npm publish."
          else
            unset NODE_AUTH_TOKEN
            unset NPM_CONFIG_USERCONFIG
            echo "No NPM_TOKEN configured; relying on npm Trusted Publishing/OIDC for publish."
          fi

          npm publish --registry=https://registry.npmjs.org/ --access public --tag "$NPM_TAG" --provenance
