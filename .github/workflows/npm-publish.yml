name: Publish npm

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Git release tag to publish, such as v0.3.2.
        required: true
        type: string
      dry_run:
        description: Run npm publish with --dry-run instead of publishing.
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      tag:
        description: npm dist-tag to publish.
        required: true
        default: latest
        type: string

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      already_published: ${{ steps.dry_run_package_version.outputs.already_published || 'false' }}
      package_name: ${{ steps.package_metadata.outputs.package_name }}
      package_version: ${{ steps.package_metadata.outputs.package_version }}

    steps:
      - name: Check release tag input
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Expected a semver tag like v0.3.2, got $RELEASE_TAG."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Show package tooling versions
        run: |
          node --version
          npm --version
          pnpm --version

      - name: Verify package version matches tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${RELEASE_TAG#v}"

          if [ "$package_version" != "$tag_version" ]; then
            echo "package.json version $package_version does not match tag $RELEASE_TAG."
            exit 1
          fi

      - name: Capture package metadata
        id: package_metadata
        run: |
          echo "package_name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "package_version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check packed install
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['release:check-pack'] ? 0 : 1)"; then
            pnpm release:check-pack
          else
            echo "release:check-pack is not available on this release tag; skipping packed install check."
          fi

      - name: Check dry-run package version
        id: dry_run_package_version
        if: ${{ inputs.dry_run == 'true' }}
        run: |
          package_name="${{ steps.package_metadata.outputs.package_name }}"
          package_version="${{ steps.package_metadata.outputs.package_version }}"
          echo "already_published=false" >> "$GITHUB_OUTPUT"

          if published_version="$(npm view "$package_name@$package_version" version --json --registry=https://registry.npmjs.org/ 2>/tmp/npm-view-version.err)"; then
            published_version="$(node -e "console.log(JSON.parse(process.argv[1]))" "$published_version")"

            if [ "$published_version" = "$package_version" ]; then
              echo "already_published=true" >> "$GITHUB_OUTPUT"
              echo "::notice title=Already published::$package_name@$package_version is already published on npm. The dry-run workflow passed install, tests, build, and packed-install checks; skipping npm publish --dry-run because npm rejects previously published versions."
              exit 0
            fi
          else
            echo "No published $package_name@$package_version found on npm; continuing to npm publish --dry-run."
          fi

      - name: Pack publish artifact
        if: ${{ inputs.dry_run != 'true' || steps.dry_run_package_version.outputs.already_published != 'true' }}
        run: |
          mkdir -p "$RUNNER_TEMP/npm-publish"
          pack_output="$(npm pack --json --pack-destination "$RUNNER_TEMP/npm-publish")"
          tarball_name="$(node -e "console.log(JSON.parse(process.argv[1])[0].filename)" "$pack_output")"
          tarball_path="$RUNNER_TEMP/npm-publish/$tarball_name"

          if [ ! -s "$tarball_path" ]; then
            echo "Packed tarball was not created at $tarball_path."
            exit 1
          fi

          echo "Packed $tarball_name for the isolated publish job."

      - name: Upload package artifact
        if: ${{ inputs.dry_run != 'true' || steps.dry_run_package_version.outputs.already_published != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-publish/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish package
    needs: preflight
    if: ${{ inputs.dry_run != 'true' || needs.preflight.outputs.already_published != 'true' }}
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: npm-package

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Show package tooling versions
        run: |
          node --version
          npm --version

      - name: Dry-run publish
        if: ${{ inputs.dry_run == 'true' }}
        env:
          NPM_TAG: ${{ inputs.tag }}
        run: |
          tarball="$(find npm-package -maxdepth 1 -type f -name '*.tgz' | head -n 1)"
          if [ -z "$tarball" ]; then
            echo "No package tarball found."
            exit 1
          fi
          tarball="$(realpath "$tarball")"

          npm publish "$tarball" --registry=https://registry.npmjs.org/ --access public --tag "$NPM_TAG" --provenance --dry-run

      - name: Publish
        if: ${{ inputs.dry_run != 'true' }}
        env:
          NPM_TAG: ${{ inputs.tag }}
        run: |
          tarball="$(find npm-package -maxdepth 1 -type f -name '*.tgz' | head -n 1)"
          if [ -z "$tarball" ]; then
            echo "No package tarball found."
            exit 1
          fi
          tarball="$(realpath "$tarball")"

          npm publish "$tarball" --registry=https://registry.npmjs.org/ --access public --tag "$NPM_TAG" --provenance
